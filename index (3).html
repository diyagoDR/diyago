<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<meta name="description" content="尉跃海｜AI 应用、数字化运营、新媒体视觉方向个人交互简历">
<title>YU YUE HAI / PERSONAL ARCHIVE</title>

<style>
:root{
  --black:#070707;
  --black2:#101010;
  --black3:#171717;
  --red:#d71938;
  --red-dark:#8f0f26;
  --white:#f3f1eb;
  --grey:#8f9294;
  --grey2:#55595c;
  --yellow:#f4e74d;
  --nav:60px;
  --ease:cubic-bezier(.17,.84,.18,1);
}

*{box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--black);
  color:var(--white);
  font-family:
    -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
    "Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}

button,a{font:inherit;color:inherit}
button{cursor:pointer}
a{text-decoration:none}
button:focus-visible,a:focus-visible{
  outline:2px solid var(--white);
  outline-offset:4px;
}
::selection{background:var(--red);color:white}

body.intro-active{overflow:hidden}

#app{
  position:relative;
  width:100%;
  height:100%;
  isolation:isolate;
  background:var(--black);
}

/* =========================================================
   OPENING
   ========================================================= */

.intro{
  position:fixed;
  inset:0;
  z-index:5000;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:var(--black);
  transition:
    opacity .55s var(--ease),
    visibility .55s;
}

.intro.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.intro-red{
  position:absolute;
  z-index:-3;
  width:58vw;
  height:140vh;
  right:-15vw;
  top:-20vh;
  background:var(--red);
  transform:rotate(13deg) translateX(40%);
  animation:redEnter 3.1s var(--ease) forwards;
}

.intro-white{
  position:absolute;
  z-index:-2;
  width:32vw;
  height:130vh;
  left:-16vw;
  top:-13vh;
  background:var(--white);
  transform:rotate(-12deg) translateX(-70%);
  animation:whiteEnter 3.1s var(--ease) forwards;
}

.intro-black-cut{
  position:absolute;
  z-index:-1;
  width:36vw;
  height:135vh;
  right:23vw;
  top:-15vh;
  background:var(--black);
  transform:rotate(-7deg);
}

@keyframes redEnter{
  to{transform:rotate(13deg) translateX(0)}
}
@keyframes whiteEnter{
  to{transform:rotate(-12deg) translateX(0)}
}

.skip{
  position:absolute;
  right:22px;
  top:20px;
  height:37px;
  padding:0 14px;
  border:2px solid var(--white);
  background:var(--black);
  color:var(--white);
  font-size:9px;
  font-weight:900;
  letter-spacing:.17em;
  transform:rotate(-2deg);
}

.intro-center{
  position:relative;
  width:min(920px,90vw);
  text-align:center;
}

.intro-meta{
  margin-bottom:8px;
  font:900 9px/1.4 Arial,sans-serif;
  letter-spacing:.34em;
  opacity:0;
  animation:introMeta .55s ease 1.65s forwards;
}

@keyframes introMeta{to{opacity:.72}}

.signature{
  position:relative;
  height:180px;
}

.signature svg{
  width:100%;
  height:100%;
  overflow:visible;
}

.signature-text,
.signature-shadow{
  font-family:
    "Snell Roundhand","Segoe Script","Brush Script MT",
    "URW Chancery L",cursive;
  font-size:108px;
  font-style:italic;
  font-weight:500;
  letter-spacing:4px;
  text-anchor:middle;
  fill:transparent;
  stroke-linecap:round;
  stroke-linejoin:round;
  stroke-dasharray:1600;
  stroke-dashoffset:1600;
  animation:writeName 2.45s var(--ease) .28s forwards;
}

.signature-text{
  stroke:var(--white);
  stroke-width:1.4;
}

.signature-shadow{
  stroke:var(--red);
  stroke-width:5;
  opacity:.23;
}

@keyframes writeName{
  0%{stroke-dashoffset:1600;fill:transparent}
  82%{stroke-dashoffset:0;fill:transparent}
  100%{stroke-dashoffset:0;fill:var(--white)}
}

.pen-dot{
  position:absolute;
  left:14%;
  bottom:27px;
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--white);
  opacity:0;
  animation:penMove 2.45s var(--ease) .3s forwards;
}

@keyframes penMove{
  0%{left:14%;opacity:0}
  5%{opacity:1}
  95%{left:86%;opacity:1}
  100%{left:88%;opacity:0}
}

.intro-cn{
  position:absolute;
  left:50%;
  top:54%;
  transform:translate(-50%,-50%) scale(.72);
  z-index:-1;
  font-size:clamp(67px,9vw,122px);
  line-height:.8;
  font-weight:1000;
  letter-spacing:-.14em;
  color:var(--white);
  opacity:0;
}

.intro.merge .intro-cn{
  animation:cnMerge .66s var(--ease) forwards;
}

.intro.merge .signature{
  animation:enMerge .66s var(--ease) forwards;
}

@keyframes cnMerge{
  to{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
}

@keyframes enMerge{
  to{
    transform:translate(12%,23%) rotate(-4deg) scale(.54);
  }
}

.intro.flash .intro-center{
  animation:introFlash .42s steps(2,end);
}

@keyframes introFlash{
  0%{filter:none}
  18%{filter:invert(1)}
  36%{filter:none;transform:translateX(5px)}
  54%{filter:contrast(2);transform:translateX(-5px)}
  72%{filter:invert(1)}
  100%{filter:none;transform:none}
}

.intro-caption{
  margin-top:-18px;
  font:900 8px/1.5 Arial,sans-serif;
  letter-spacing:.4em;
  opacity:0;
  animation:introMeta .5s ease 2.5s forwards;
}

/* =========================================================
   TOP BAR
   ========================================================= */

.topbar{
  position:absolute;
  z-index:180;
  left:0;
  top:0;
  right:0;
  height:var(--nav);
  display:flex;
  align-items:center;
  padding:0 clamp(15px,3vw,42px);
  border-bottom:2px solid var(--white);
  background:var(--black);
}

.brand{
  display:flex;
  align-items:baseline;
  gap:12px;
}

.brand-cn{
  font-size:17px;
  font-weight:1000;
  letter-spacing:-.08em;
}

.brand-en{
  font-family:"Snell Roundhand","Segoe Script","Brush Script MT",cursive;
  font-size:18px;
  font-style:italic;
  transform:rotate(-5deg);
}

.top-meta{
  margin-left:26px;
  color:var(--grey);
  font:900 8px/1 Arial,sans-serif;
  letter-spacing:.2em;
}

.top-actions{
  margin-left:auto;
  display:flex;
  gap:7px;
}

.top-btn{
  height:35px;
  padding:0 11px;
  border:2px solid var(--white);
  background:var(--black);
  color:var(--white);
  font-size:8px;
  font-weight:900;
  letter-spacing:.12em;
  transition:.16s ease;
}

.top-btn:hover{
  color:var(--black);
  background:var(--white);
}

/* =========================================================
   STAGE
   ========================================================= */

.stage{
  position:absolute;
  inset:var(--nav) 0 0;
  overflow:hidden;
}

.scene{
  position:absolute;
  inset:0;
  opacity:0;
  pointer-events:none;
  transition:opacity .34s ease;
}

.scene.active{
  opacity:1;
  pointer-events:auto;
}

/* =========================================================
   HOME BACKGROUND
   ========================================================= */

.home-scene{
  background:var(--black);
}

.home-scene::before{
  content:"";
  position:absolute;
  z-index:0;
  width:52vw;
  height:130vh;
  top:-18vh;
  right:-17vw;
  background:var(--red);
  transform:rotate(12deg);
}

.home-scene::after{
  content:"";
  position:absolute;
  z-index:0;
  width:29vw;
  height:105vh;
  left:-17vw;
  bottom:-20vh;
  background:var(--white);
  transform:rotate(-17deg);
}

.white-cut{
  position:absolute;
  z-index:1;
  width:21vw;
  height:45vh;
  right:-8vw;
  bottom:-9vh;
  background:var(--white);
  transform:rotate(18deg);
}

.red-cut{
  position:absolute;
  z-index:1;
  width:19vw;
  height:35vh;
  left:6vw;
  top:-15vh;
  background:var(--red);
  transform:rotate(-22deg);
}

.home-inner{
  position:relative;
  z-index:10;
  width:min(calc(100% - 40px),1360px);
  height:100%;
  margin:auto;
}

/* =========================================================
   LOGO
   ========================================================= */

.logo-core{
  position:absolute;
  z-index:30;
  left:50%;
  top:48%;
  width:min(780px,78vw);
  transform:translate(-50%,-50%);
  text-align:center;
  opacity:0;
  transition:
    left .8s var(--ease),
    top .8s var(--ease),
    transform .8s var(--ease),
    width .8s var(--ease);
}

.home-scene.ready .logo-core{
  opacity:1;
}

.logo-click{
  border:0;
  background:transparent;
  padding:0;
  cursor:pointer;
  color:inherit;
}

.logo-stack{
  position:relative;
  display:inline-block;
}

.cn-name{
  position:relative;
  z-index:2;
  margin:0;
  font-size:clamp(78px,11vw,156px);
  line-height:.82;
  font-weight:1000;
  letter-spacing:-.14em;
  color:var(--white);
}

.cn-name::before{
  content:attr(data-text);
  position:absolute;
  inset:0;
  color:var(--red);
  transform:translate(7px,5px);
  z-index:-1;
}

.en-name{
  position:absolute;
  z-index:4;
  right:-6%;
  bottom:-33px;
  white-space:nowrap;
  font-family:
    "Snell Roundhand","Segoe Script","Brush Script MT",
    "URW Chancery L",cursive;
  font-size:clamp(31px,4.7vw,60px);
  font-style:italic;
  color:var(--white);
  transform:rotate(-7deg);
  text-shadow:3px 3px 0 var(--black);
}

.logo-core.flash{
  animation:logoFlash .45s steps(2,end);
}

@keyframes logoFlash{
  0%{filter:none}
  15%{filter:invert(1)}
  30%{filter:none;transform:translate(-50%,-50%) translateX(6px)}
  48%{filter:contrast(2)}
  63%{transform:translate(-50%,-50%) translateX(-6px)}
  78%{filter:invert(1)}
  100%{filter:none;transform:translate(-50%,-50%)}
}

.logo-core.clickable .logo-click{
  animation:logoPulse 1.6s ease-in-out infinite;
}

@keyframes logoPulse{
  0%,80%,100%{transform:none}
  87%{transform:scale(1.012) rotate(-.25deg)}
  93%{transform:scale(.995) rotate(.2deg)}
}

.logo-core.menu-mode{
  left:26%;
  top:49%;
  width:min(520px,42vw);
}

.logo-core.menu-mode .cn-name{
  font-size:clamp(65px,7.7vw,112px);
}

.logo-core.menu-mode .en-name{
  font-size:clamp(27px,3.7vw,47px);
}

.logo-sub{
  margin-top:53px;
  color:#d3d3d3;
  font-size:10px;
  font-weight:900;
  letter-spacing:.12em;
}

.logo-sub span:not(:last-child)::after{
  content:" / ";
  color:var(--red);
  padding:0 10px;
}

.logo-core.menu-mode .logo-sub{
  display:none;
}

.click-hint{
  margin-top:18px;
  color:var(--grey);
  font:900 8px/1.5 Arial,sans-serif;
  letter-spacing:.18em;
  opacity:0;
}

.logo-core.clickable .click-hint{
  opacity:1;
}

/* ----- MOTTO (格言) 增大、靠下、弹性出场 ----- */
#motto{
  display:block;
  margin-top:40px;
  margin-left:auto;
  margin-right:auto;
  max-width:80%;
  color:rgba(255,255,255,0.55);
  font-size:clamp(18px,2.4vw,34px);
  font-weight:500;
  letter-spacing:.06em;
  line-height:1.5;
  opacity:0;
  transform:translateY(30px) scale(0.8);
  transition:opacity 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.3s ease;
  pointer-events:none;
  text-shadow:0 2px 12px rgba(0,0,0,0.6);
  font-family:
    "PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
}
#motto em{
  font-style:normal;
  color:var(--red);
}
.home-scene.menu-opening #motto,
.home-scene.menu-open #motto{
  opacity:1;
  transform:translateY(0) scale(1);
  pointer-events:auto;
  color:rgba(255,255,255,0.75);
}
.home-scene.menu-closing #motto{
  opacity:0;
  transform:translateY(30px) scale(0.8);
  pointer-events:none;
}
.logo-core.menu-mode #motto{
  margin-top:24px;
  font-size:clamp(14px,1.8vw,26px);
  max-width:70%;
}

/* =========================================================
   MENU BURST
   ========================================================= */

.menu-layer{
  position:absolute;
  inset:0;
  z-index:45;
  pointer-events:none;
}

.menu-item{
  --x:70%;
  --y:20%;
  --rotate:-5deg;
  --delay:0ms;
  --from-x:0px;
  --from-y:0px;

  position:absolute;
  left:var(--x);
  top:var(--y);
  width:clamp(225px,22vw,335px);
  height:88px;
  border:0;
  padding:0;
  background:transparent;
  opacity:0;
  pointer-events:none;
  transform:
    translate(-50%,-50%)
    translate(var(--from-x),var(--from-y))
    scale(.06)
    rotate(-25deg);
  transition:
    opacity .18s ease var(--delay),
    transform .72s var(--ease) var(--delay);
}

.home-scene.menu-open .menu-item{
  opacity:1;
  pointer-events:auto;
  transform:
    translate(-50%,-50%)
    translate(0,0)
    scale(1)
    rotate(var(--rotate));
}

.menu01{--x:64%;--y:16%;--rotate:-5deg;--delay:40ms}
.menu02{--x:79%;--y:32%;--rotate:3deg;--delay:120ms}
.menu03{--x:82%;--y:53%;--rotate:-3deg;--delay:200ms}
.menu04{--x:72%;--y:72%;--rotate:4deg;--delay:280ms}
.menu05{--x:51%;--y:82%;--rotate:-4deg;--delay:360ms}

.menu-card-shadow{
  position:absolute;
  inset:7px -8px -7px 8px;
  background:var(--red);
  clip-path:polygon(
    0 14%,7% 14%,9% 0,
    91% 6%,100% 0,
    97% 87%,89% 85%,87% 100%,
    7% 94%,0 100%
  );
}

.menu-card{
  position:absolute;
  inset:0;
  background:var(--white);
  clip-path:polygon(
    0 14%,7% 14%,9% 0,
    91% 6%,100% 0,
    97% 87%,89% 85%,87% 100%,
    7% 94%,0 100%
  );
}

.menu-card-inner{
  position:absolute;
  inset:3px;
  display:flex;
  align-items:center;
  padding:8px 23px 8px 21px;
  background:var(--black);
  clip-path:polygon(
    0 14%,7% 14%,9% 0,
    91% 6%,100% 0,
    97% 87%,89% 85%,87% 100%,
    7% 94%,0 100%
  );
}

.menu-no{
  flex:0 0 76px;
  color:var(--white);
  font:1000 9px/1 Arial,sans-serif;
  letter-spacing:.09em;
}

.menu-title{
  min-width:0;
  text-align:left;
}

.menu-title strong{
  display:block;
  color:var(--white);
  font-size:clamp(17px,1.75vw,25px);
  line-height:1;
  font-weight:1000;
  letter-spacing:-.05em;
}

.menu-title small{
  display:block;
  margin-top:5px;
  color:#bdbdbd;
  font:900 7px/1 Arial,sans-serif;
  letter-spacing:.14em;
}

.menu-arrow{
  margin-left:auto;
  font-size:26px;
  line-height:1;
  font-weight:1000;
  color:var(--white);
  transform:rotate(-8deg);
}

.menu-item:hover,
.menu-item:focus-visible{
  z-index:80;
}

.menu-item:hover .menu-card,
.menu-item:hover .menu-card-shadow,
.menu-item:hover .menu-card-inner,
.menu-item:focus-visible .menu-card,
.menu-item:focus-visible .menu-card-shadow,
.menu-item:focus-visible .menu-card-inner{
  animation:seesaw 1s ease-in-out infinite;
}

@keyframes seesaw{
  0%,100%{transform:rotate(-.8deg)}
  50%{transform:rotate(.8deg)}
}

/* =========================================================
   BURST SHARDS
   ========================================================= */

.shard{
  position:absolute;
  z-index:38;
  left:50%;
  top:50%;
  width:18px;
  height:6px;
  background:var(--red);
  opacity:0;
  transform:translate(-50%,-50%) scale(.1);
  pointer-events:none;
}

.shard.white{background:var(--white)}
.shard.black{background:#202020}

.home-scene.menu-open .shard{
  animation:shardBurst .62s var(--ease) forwards;
}

.shard.s1{--sx:280px;--sy:-205px;--sr:26deg}
.shard.s2{--sx:350px;--sy:-65px;--sr:-18deg}
.shard.s3{--sx:330px;--sy:135px;--sr:35deg}
.shard.s4{--sx:170px;--sy:240px;--sr:-31deg}
.shard.s5{--sx:-60px;--sy:250px;--sr:17deg}
.shard.s6{--sx:230px;--sy:60px;--sr:64deg}
.shard.s7{--sx:100px;--sy:-180px;--sr:-51deg}

@keyframes shardBurst{
  0%{opacity:1;transform:translate(-50%,-50%) scale(.1)}
  65%{opacity:1}
  100%{
    opacity:.65;
    transform:
      translate(calc(-50% + var(--sx)),calc(-50% + var(--sy)))
      rotate(var(--sr))
      scale(1);
  }
}

/* =========================================================
   MENU TO FULLSCREEN
   ========================================================= */

.transition-card{
  position:fixed;
  z-index:9000;
  margin:0;
  padding:0;
  pointer-events:none;
  transform-origin:center;
  transition:
    left .58s var(--ease),
    top .58s var(--ease),
    width .58s var(--ease),
    height .58s var(--ease),
    transform .58s var(--ease),
    clip-path .58s var(--ease);
}

.transition-card.expand{
  left:0!important;
  top:0!important;
  width:100vw!important;
  height:100vh!important;
  transform:none!important;
}

.transition-card.expand .menu-card,
.transition-card.expand .menu-card-shadow,
.transition-card.expand .menu-card-inner{
  clip-path:polygon(0 0,100% 0,100% 100%,0 100%);
}

.transition-card.expand .menu-card-shadow{
  inset:0;
}

.transition-card.expand .menu-card-inner{
  inset:0;
  background:var(--black);
}

.transition-card.expand .menu-card{
  background:var(--red);
}

.transition-card.expand .menu-card-inner{
  opacity:0;
  transition:opacity .22s ease .3s;
}

.transition-red{
  position:absolute;
  inset:0;
  z-index:8500;
  pointer-events:none;
  background:var(--red);
  opacity:0;
  transition:opacity .25s ease;
}

.transition-red.on{opacity:1}

/* =========================================================
   DETAIL SCENE
   ========================================================= */

.detail-scene{
  background:var(--black);
}

.detail-scene::before{
  content:"";
  position:absolute;
  z-index:0;
  width:45vw;
  height:125vh;
  right:-18vw;
  top:-17vh;
  background:var(--red);
  transform:rotate(12deg);
}

.detail-scene::after{
  content:"";
  position:absolute;
  z-index:0;
  width:24vw;
  height:110vh;
  left:-16vw;
  bottom:-18vh;
  background:var(--white);
  transform:rotate(-14deg);
}

.detail-shell{
  position:relative;
  z-index:10;
  width:min(calc(100% - 42px),1320px);
  height:100%;
  margin:auto;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  padding:27px 0 16px;
}

.detail-header{
  position:relative;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:30px;
}

.detail-heading{
  position:relative;
  display:inline-block;
  max-width:75%;
  padding:14px 30px 15px 22px;
  background:var(--white);
  color:var(--black);
  transform:rotate(-1.5deg);
  clip-path:polygon(0 12%,5% 12%,7% 0,96% 3%,100% 88%,94% 88%,92% 100%,3% 95%);
}

.detail-code{
  color:var(--red);
  font:1000 8px/1 Arial,sans-serif;
  letter-spacing:.16em;
}

.detail-title{
  margin:6px 0 0;
  font-size:clamp(34px,4.6vw,64px);
  line-height:.88;
  font-weight:1000;
  letter-spacing:-.075em;
}

.detail-title small{
  display:block;
  margin-top:9px;
  color:#555;
  font:900 8px/1 Arial,sans-serif;
  letter-spacing:.2em;
}

.back-btn{
  position:relative;
  width:150px;
  height:57px;
  border:0;
  background:transparent;
  transform:rotate(3deg);
}

.back-btn::before{
  content:"";
  position:absolute;
  inset:5px -6px -5px 6px;
  background:var(--red);
  clip-path:polygon(0 14%,8% 14%,10% 0,100% 6%,96% 100%,4% 94%);
}

.back-btn::after{
  content:"BACK / 返回";
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  background:var(--black);
  border:3px solid var(--white);
  color:var(--white);
  clip-path:polygon(0 14%,8% 14%,10% 0,100% 6%,96% 100%,4% 94%);
  font-size:10px;
  font-weight:1000;
  letter-spacing:.12em;
}

.back-btn:hover{
  animation:seesaw 1s ease-in-out infinite;
}

.detail-content{
  min-height:0;
  display:flex;
  align-items:center;
  padding:22px 0 15px;
}

.detail-grid{
  width:100%;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.detail-grid.cols4{
  grid-template-columns:repeat(4,minmax(0,1fr));
}

.detail-card{
  position:relative;
  min-width:0;
  padding:22px;
  background:var(--black);
  border:3px solid var(--white);
  box-shadow:8px 8px 0 var(--red);
  transform:rotate(var(--tilt,0deg));
  overflow:hidden;
}

.detail-card:nth-child(odd){--tilt:-.6deg}
.detail-card:nth-child(even){--tilt:.7deg}

.detail-card::before{
  content:"";
  position:absolute;
  width:55px;
  height:55px;
  right:-23px;
  top:-22px;
  background:var(--red);
  transform:rotate(30deg);
}

.card-index{
  color:var(--red);
  font:1000 8px/1 Arial,sans-serif;
  letter-spacing:.14em;
}

.card-number{
  margin-top:12px;
  color:var(--white);
  font:1000 clamp(34px,4vw,56px)/.9 "Arial Narrow",Arial,sans-serif;
  letter-spacing:-.06em;
}

.card-number span{
  color:var(--red);
  font-size:.45em;
}

.detail-card h3{
  margin:14px 0 6px;
  font-size:clamp(17px,1.7vw,24px);
  line-height:1.1;
  font-weight:1000;
  letter-spacing:-.04em;
}

.card-meta{
  color:var(--red);
  font:1000 8px/1.45 Arial,sans-serif;
  letter-spacing:.08em;
}

.card-copy{
  margin-top:9px;
  color:#a9abad;
  font-size:10px;
  line-height:1.65;
}

.card-list{
  margin:13px 0 0;
  padding:0;
  list-style:none;
  color:#c3c4c5;
  font-size:10px;
  line-height:1.62;
}

.card-list li{
  position:relative;
  padding-left:14px;
  margin:6px 0;
}

.card-list li::before{
  content:"";
  position:absolute;
  left:0;
  top:.7em;
  width:7px;
  height:3px;
  background:var(--red);
  transform:rotate(-8deg);
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:12px;
}

.chip{
  padding:4px 7px;
  color:var(--black);
  background:var(--white);
  font-size:7px;
  font-weight:1000;
  letter-spacing:.05em;
}

.result-line{
  margin-top:13px;
  padding-top:10px;
  border-top:2px solid var(--white);
  color:#d4d4d4;
  font-size:9px;
  line-height:1.55;
}

.result-line strong{color:var(--red)}

.skill-row{
  display:grid;
  grid-template-columns:108px 1fr 58px;
  gap:10px;
  align-items:center;
  min-height:39px;
  border-top:1px solid #333;
  font-size:9px;
}

.skill-row:first-of-type{margin-top:14px}

.skill-track{
  height:5px;
  background:#292929;
}

.skill-track i{
  display:block;
  width:var(--level);
  height:100%;
  background:var(--red);
}

.skill-state{
  color:#8d8d8d;
  text-align:right;
  font-size:7px;
}

.edu-date{
  margin-top:5px;
  color:#888;
  font:900 8px/1.4 Arial,sans-serif;
}

.honor{
  padding:10px 0;
  border-top:1px solid #333;
}

.honor strong{
  display:block;
  font-size:10px;
}

.honor small{
  display:block;
  margin-top:3px;
  color:#888;
  font-size:8px;
}

.detail-footer{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  color:#777;
  font:900 7px/1.5 Arial,sans-serif;
  letter-spacing:.14em;
}

.detail-footer strong{color:var(--white)}

.pager{
  display:none;
  gap:7px;
  align-items:center;
}

.pager button{
  width:38px;
  height:31px;
  border:2px solid var(--white);
  background:var(--black);
  color:var(--white);
}

.page-count{
  min-width:55px;
  text-align:center;
}

/* =========================================================

   ========================================================= */

  position:fixed;
  z-index:10000;
  left:50%;
  bottom:18px;

/* =========================================================
   CURRENT MENU BEHAVIOUR OVERRIDES
   ========================================================= */

.logo-core.menu-mode .click-hint{
  opacity:0;
  pointer-events:none;
}

.logo-core.clickable .logo-click{
  animation:nameSeesawCurrent 2.4s ease-in-out infinite;
}

@keyframes nameSeesawCurrent{
  0%,68%,100%{transform:rotate(0) translateY(0)}
  75%{transform:rotate(-2.7deg) translateY(-3px)}
  82%{transform:rotate(2.7deg) translateY(2px)}
  89%{transform:rotate(-1.4deg) translateY(-1px)}
  95%{transform:rotate(.7deg)}
}

.menu-item{
  --over-x:0px;
  --over-y:0px;
  --settle-x:0px;
  --settle-y:0px;
  --burst-delay:0ms;
  opacity:0;
  pointer-events:none;
  transition:none;
  transform:
    translate(-50%,-50%)
    translate(var(--from-x),var(--from-y))
    scale(.025)
    rotate(-36deg);
}

.home-scene.menu-opening .menu-item{
  pointer-events:none;
  animation:menuBurstCurrent .82s cubic-bezier(.12,.88,.16,1)
            var(--burst-delay) both;
}

.home-scene.menu-open .menu-item{
  animation:none;
  opacity:1;
  pointer-events:auto;
  transform:
    translate(-50%,-50%)
    translate(0,0)
    scale(1)
    rotate(var(--rotate));
}

.home-scene.menu-closing .menu-item{
  pointer-events:none;
  animation:menuImplodeCurrent .48s cubic-bezier(.72,0,.83,.2)
            var(--burst-delay) both;
}

@keyframes menuBurstCurrent{
  0%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      translate(var(--from-x),var(--from-y))
      scale(.025)
      rotate(-38deg);
  }
  10%{opacity:1}
  38%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      translate(calc(var(--over-x) * .42),calc(var(--over-y) * .42))
      scale(.72)
      rotate(9deg);
  }
  62%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      translate(var(--over-x),var(--over-y))
      scale(1.17)
      rotate(-8deg);
  }
  80%{
    transform:
      translate(-50%,-50%)
      translate(var(--settle-x),var(--settle-y))
      scale(.965)
      rotate(3.5deg);
  }
  92%{
    transform:
      translate(-50%,-50%)
      scale(1.028)
      rotate(calc(var(--rotate) - 1deg));
  }
  100%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(1)
      rotate(var(--rotate));
  }
}

@keyframes menuImplodeCurrent{
  0%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(1)
      rotate(var(--rotate));
  }
  18%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      translate(var(--settle-x),var(--settle-y))
      scale(1.08)
      rotate(-5deg);
  }
  100%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      translate(var(--from-x),var(--from-y))
      scale(.025)
      rotate(-38deg);
  }
}

.menu-card-shadow,
.menu-card,
.menu-card-inner{
  clip-path:polygon(
    0 15%,5% 15%,8% 3%,13% 7%,18% 0,
    28% 5%,37% 1%,53% 6%,64% 2%,76% 7%,91% 5%,100% 0,
    97% 30%,100% 43%,96% 58%,99% 87%,91% 84%,87% 100%,
    72% 94%,64% 100%,54% 94%,43% 99%,31% 94%,18% 100%,
    7% 94%,0 100%,3% 71%,0 58%
  );
}

.menu-card-inner::before{
  content:"";
  position:absolute;
  right:42px;
  top:-10px;
  width:30px;
  height:115%;
  background:var(--red);
  transform:rotate(16deg);
  opacity:.18;
  pointer-events:none;
}

.menu-card-inner::after{
  content:"";
  position:absolute;
  left:82px;
  top:0;
  width:3px;
  height:100%;
  background:var(--white);
  opacity:.12;
  pointer-events:none;
}

.menu-splinter{
  position:absolute;
  z-index:-1;
  display:block;
  opacity:0;
  transform-origin:center;
  pointer-events:none;
}
.menu-splinter.red{background:var(--red)}
.menu-splinter.white{background:var(--white)}
.menu-splinter.a{
  width:52px;height:14px;left:-20px;top:4px;background:var(--white);
  clip-path:polygon(0 29%,100% 0,78% 100%,18% 69%);
}
.menu-splinter.b{
  width:42px;height:11px;right:-18px;top:15px;background:var(--red);
  clip-path:polygon(0 0,100% 37%,79% 100%,7% 62%);
}
.menu-splinter.c{
  width:65px;height:10px;right:1px;bottom:-13px;background:var(--white);
  clip-path:polygon(0 32%,100% 0,87% 100%,8% 65%);
}
.menu-splinter.d{
  width:32px;height:18px;left:20px;bottom:-17px;background:var(--red);
  clip-path:polygon(0 0,100% 21%,65% 100%,18% 76%);
}
.menu-splinter.e{
  width:31px;height:8px;left:42%;top:-11px;background:var(--red);
  clip-path:polygon(0 32%,100% 0,81% 100%,8% 67%);
}
.menu-splinter.f{
  width:29px;height:9px;right:22%;bottom:-10px;background:var(--white);
  clip-path:polygon(0 0,100% 32%,77% 100%,9% 58%);
}

.home-scene.menu-opening .menu-splinter.a{
  animation:splinterACurrent .68s var(--ease) calc(var(--burst-delay) + 110ms) both;
}
.home-scene.menu-opening .menu-splinter.b{
  animation:splinterBCurrent .72s var(--ease) calc(var(--burst-delay) + 90ms) both;
}
.home-scene.menu-opening .menu-splinter.c{
  animation:splinterCCurrent .67s var(--ease) calc(var(--burst-delay) + 130ms) both;
}
.home-scene.menu-opening .menu-splinter.d{
  animation:splinterDCurrent .73s var(--ease) calc(var(--burst-delay) + 120ms) both;
}
.home-scene.menu-opening .menu-splinter.e{
  animation:splinterECurrent .64s var(--ease) calc(var(--burst-delay) + 150ms) both;
}
.home-scene.menu-opening .menu-splinter.f{
  animation:splinterFCurrent .69s var(--ease) calc(var(--burst-delay) + 145ms) both;
}

.home-scene.menu-open .menu-splinter{opacity:1;animation:none}
.home-scene.menu-open .menu-splinter.a{transform:translate(-7px,-8px) rotate(-21deg)}
.home-scene.menu-open .menu-splinter.b{transform:translate(9px,-5px) rotate(17deg)}
.home-scene.menu-open .menu-splinter.c{transform:translate(10px,7px) rotate(-11deg)}
.home-scene.menu-open .menu-splinter.d{transform:translate(-6px,10px) rotate(16deg)}
.home-scene.menu-open .menu-splinter.e{transform:translate(2px,-7px) rotate(8deg)}
.home-scene.menu-open .menu-splinter.f{transform:translate(6px,7px) rotate(-7deg)}

@keyframes splinterACurrent{
  0%{opacity:0;transform:translate(38px,26px) scale(.1)}
  46%{opacity:1}
  72%{transform:translate(-16px,-14px) scale(1.16) rotate(-28deg)}
  100%{opacity:1;transform:translate(-7px,-8px) rotate(-21deg)}
}
@keyframes splinterBCurrent{
  0%{opacity:0;transform:translate(-35px,20px) scale(.1)}
  50%{opacity:1}
  74%{transform:translate(17px,-11px) scale(1.18) rotate(25deg)}
  100%{opacity:1;transform:translate(9px,-5px) rotate(17deg)}
}
@keyframes splinterCCurrent{
  0%{opacity:0;transform:translate(-29px,-22px) scale(.1)}
  48%{opacity:1}
  73%{transform:translate(18px,14px) scale(1.17) rotate(-18deg)}
  100%{opacity:1;transform:translate(10px,7px) rotate(-11deg)}
}
@keyframes splinterDCurrent{
  0%{opacity:0;transform:translate(20px,-26px) scale(.1)}
  45%{opacity:1}
  72%{transform:translate(-13px,19px) scale(1.2) rotate(24deg)}
  100%{opacity:1;transform:translate(-6px,10px) rotate(16deg)}
}
@keyframes splinterECurrent{
  0%{opacity:0;transform:translateY(22px) scale(.1)}
  50%{opacity:1}
  76%{transform:translate(4px,-15px) scale(1.2) rotate(14deg)}
  100%{opacity:1;transform:translate(2px,-7px) rotate(8deg)}
}
@keyframes splinterFCurrent{
  0%{opacity:0;transform:translateY(-19px) scale(.1)}
  50%{opacity:1}
  74%{transform:translate(12px,14px) scale(1.18) rotate(-13deg)}
  100%{opacity:1;transform:translate(6px,7px) rotate(-7deg)}
}

.menu-item:hover .menu-card,
.menu-item:hover .menu-card-shadow,
.menu-item:hover .menu-card-inner,
.menu-item:hover .menu-splinter,
.menu-item:focus-visible .menu-card,
.menu-item:focus-visible .menu-card-shadow,
.menu-item:focus-visible .menu-card-inner,
.menu-item:focus-visible .menu-splinter{
  animation:seesawCurrent 1s ease-in-out infinite;
}

@keyframes seesawCurrent{
  0%{transform:rotate(-2.7deg) translateY(-2px)}
  50%{transform:rotate(2.7deg) translateY(2px)}
  100%{transform:rotate(-2.7deg) translateY(-2px)}
}

.shard{width:25px;height:8px}
.home-scene.menu-opening .shard{
  animation:shardBurstCurrent .72s var(--ease) forwards;
}
.home-scene.menu-open .shard{
  animation:none;
  opacity:.72;
  transform:
    translate(calc(-50% + var(--sx)),calc(-50% + var(--sy)))
    rotate(var(--sr))
    scale(1);
}
.home-scene.menu-closing .shard{
  animation:shardReturnCurrent .35s ease forwards;
}

@keyframes shardBurstCurrent{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.05)}
  14%{opacity:1}
  72%{
    opacity:1;
    transform:
      translate(calc(-50% + var(--sx)),calc(-50% + var(--sy)))
      rotate(var(--sr))
      scale(1.25);
  }
  100%{
    opacity:.72;
    transform:
      translate(calc(-50% + var(--sx)),calc(-50% + var(--sy)))
      rotate(var(--sr))
      scale(1);
  }
}

@keyframes shardReturnCurrent{
  from{
    opacity:.72;
    transform:
      translate(calc(-50% + var(--sx)),calc(-50% + var(--sy)))
      rotate(var(--sr))
      scale(1);
  }
  to{opacity:0;transform:translate(-50%,-50%) scale(.05)}
}

.shard.s8{--sx:465px;--sy:35px;--sr:13deg}
.shard.s9{--sx:315px;--sy:290px;--sr:-22deg}
.shard.s10{--sx:75px;--sy:205px;--sr:42deg}

/* =========================================================
   DETAIL PORTAL + SCROLLING DETAIL PAGE
   ========================================================= */
.detail-scene{
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  scroll-behavior:smooth;
  scrollbar-width:thin;
  scrollbar-color:var(--red) var(--black);
}
.detail-scene::-webkit-scrollbar{width:8px}
.detail-scene::-webkit-scrollbar-track{background:var(--black)}
.detail-scene::-webkit-scrollbar-thumb{background:var(--red);border:2px solid var(--black)}
.detail-scene::before,.detail-scene::after{display:none}
.detail-shell{width:100%;height:auto;min-height:100%;padding:0;margin:0;display:block}

.detail-title-page{
  position:relative;
  isolation:isolate;
  min-height:calc(100vh - var(--nav));
  overflow:hidden;
  display:grid;
  place-items:center;
  padding:clamp(28px,5vw,72px);
  background:var(--black);
}
.detail-title-page::before{
  content:"";
  position:absolute;
  z-index:-3;
  width:64vw;
  height:145%;
  right:-24vw;
  top:-22%;
  background:var(--red);
  transform:rotate(13deg);
  clip-path:polygon(0 0,100% 0,100% 100%,17% 100%,25% 87%,12% 76%,27% 62%,10% 48%,24% 33%,11% 19%);
}
.detail-title-page::after{
  content:"";
  position:absolute;
  z-index:-2;
  width:38vw;
  height:118%;
  left:-22vw;
  bottom:-17%;
  background:var(--white);
  transform:rotate(-16deg);
  clip-path:polygon(0 0,86% 0,72% 12%,91% 25%,74% 39%,94% 55%,74% 68%,91% 82%,78% 100%,0 100%);
}
.detail-title-cut{
  position:absolute;
  z-index:-1;
  width:29vw;
  height:136%;
  right:29vw;
  top:-18%;
  background:var(--black);
  transform:rotate(-8deg);
  clip-path:polygon(12% 0,100% 0,87% 15%,100% 31%,84% 48%,98% 65%,82% 82%,93% 100%,0 100%,10% 83%,0 64%,11% 45%,1% 26%);
}
.detail-title-stage{
  width:min(1050px,88vw);
  text-align:center;
  transform:rotate(-1.2deg)
}
.detail-title-page .detail-code{
  display:inline-block;
  padding:6px 11px;
  margin-bottom:16px;
  background:var(--red);
  color:var(--white);
  font:1000 9px/1 Arial,sans-serif;
  letter-spacing:.22em;
  transform:rotate(1.5deg);
}
.detail-title-page .detail-title{
  position:relative;
  margin:0;
  color:var(--white);
  font-size:clamp(72px,12vw,180px);
  line-height:.78;
  font-weight:1000;
  letter-spacing:-.105em;
  text-shadow:8px 8px 0 var(--red);
  cursor:pointer;
  user-select:none;
  transform-origin:center;
  transition:transform .16s ease,text-shadow .16s ease;
}
.detail-title-page .detail-title:hover{transform:rotate(.7deg) scale(1.012);text-shadow:10px 10px 0 var(--red)}
.detail-title-page .detail-title:focus-visible{outline:3px solid var(--white);outline-offset:12px}
.detail-title-page .detail-title small{
  display:block;
  width:max-content;
  max-width:100%;
  margin:24px auto 0;
  padding:7px 13px;
  background:var(--white);
  color:var(--black);
  font:1000 clamp(8px,1vw,11px)/1 Arial,sans-serif;
  letter-spacing:.24em;
  transform:rotate(1.4deg);
}
.detail-title-rule{
  width:min(540px,62vw);
  height:9px;
  margin:25px auto 0;
  background:var(--red);
  clip-path:polygon(0 34%,88% 0,100% 32%,91% 71%,100% 100%,0 67%);
}
.detail-return-hint{
  margin-top:20px;
  color:rgba(255,255,255,0.25);
  font-size:clamp(8px,0.8vw,11px);
  font-weight:400;
  letter-spacing:.18em;
  text-transform:uppercase;
  transition:color .2s ease;
}
.detail-return-hint:hover{
  color:rgba(255,255,255,0.5);
}
.detail-title-page .back-btn{
  display:none !important;
}
.detail-scroll-cue{
  position:absolute;
  left:50%;
  bottom:26px;
  transform:translateX(-50%) rotate(-1deg);
  min-width:180px;
  min-height:42px;
  padding:0 16px;
  border:2px solid var(--white);
  background:var(--black);
  color:var(--white);
  font-size:8px;
  font-weight:1000;
  letter-spacing:.18em;
  transition:background .16s ease,color .16s ease,transform .16s ease;
}
.detail-scroll-cue:hover{background:var(--white);color:var(--black);transform:translateX(-50%) rotate(1deg) translateY(-2px)}

.detail-body-page{
  position:relative;
  min-height:100vh;
  padding:clamp(54px,7vw,100px) clamp(20px,5vw,76px) 46px;
  background:var(--black);
  border-top:10px solid var(--red);
  overflow:hidden;
}
.detail-body-page::before{
  content:"";
  position:absolute;
  right:-13vw;
  top:8%;
  width:29vw;
  height:58vh;
  background:var(--red);
  transform:rotate(15deg);
  z-index:0;
}
.detail-body-page::after{
  content:"";
  position:absolute;
  left:-15vw;
  bottom:7%;
  width:26vw;
  height:48vh;
  background:var(--white);
  transform:rotate(-18deg);
  z-index:0;
}
.detail-body-label,.detail-content,.detail-footer{position:relative;z-index:2}
.detail-body-label{
  width:min(1200px,100%);
  margin:0 auto 16px;
  color:var(--red);
  font:1000 9px/1 Arial,sans-serif;
  letter-spacing:.22em;
}
.detail-body-label::after{content:"";display:inline-block;vertical-align:middle;width:70px;height:3px;margin-left:12px;background:var(--red)}
.detail-content{min-height:0;display:block;padding:0}
.detail-grid,.detail-grid.cols4{
  width:min(1200px,100%);
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
  align-items:start;
}

/* --- 恢复舒适排版 --- */
.detail-card{
  display:block!important;
  min-height:0!important;
  padding:22px 26px;
  box-shadow:8px 8px 0 var(--red);
  border-width:3px;
}
.detail-card h3{
  margin:12px 0 4px;
  font-size:clamp(18px,1.8vw,26px);
  letter-spacing:-.03em;
}
.detail-card .card-index{
  font-size:9px;
  letter-spacing:.12em;
}
.detail-card .card-meta{
  font-size:9px;
  margin-bottom:2px;
}
.detail-card .card-copy{
  font-size:10px;
  line-height:1.6;
  margin-top:6px;
}
.detail-card .card-list{
  font-size:10px;
  line-height:1.5;
  margin-top:6px;
}
.detail-card .card-list li{
  margin:3px 0;
}
.detail-card .result-line{
  font-size:9px;
  margin-top:8px;
  padding-top:6px;
}
.detail-card .chips{
  margin-top:6px;
  gap:4px;
}
.detail-card .chip{
  font-size:7px;
  padding:3px 8px;
}
.detail-card .skill-row{
  font-size:9px;
  grid-template-columns:100px 1fr 50px;
  gap:8px;
  min-height:32px;
  padding:4px 0;
}
.detail-card .skill-row:first-of-type{
  margin-top:8px;
}
.detail-card .skill-track{
  height:4px;
}
.detail-card .skill-state{
  font-size:7px;
}
.detail-card .edu-date{
  font-size:8px;
  margin-top:2px;
}
.detail-card .honor{
  padding:6px 0;
}
.detail-card .honor strong{
  font-size:10px;
}
.detail-card .honor small{
  font-size:8px;
}
.detail-grid .detail-card:nth-child(3n+1){transform:rotate(-.5deg)}
.detail-grid .detail-card:nth-child(3n+2){transform:rotate(.4deg)}
.detail-grid .detail-card:nth-child(3n+3){transform:rotate(-.15deg)}

/* --- 经历档案：校园公益志愿服务负责人 跨两列 --- */
.detail-card.exp-fullwidth{
  grid-column:1 / -1;
  padding:22px 28px;
}
.detail-card.exp-fullwidth .card-list{
  column-count:2;
  column-gap:24px;
  margin-top:6px;
}
.detail-card.exp-fullwidth .card-list li{
  break-inside:avoid;
  margin:3px 0;
}

/* --- 摄影作品卡片跨两列，放大展示 --- */
.detail-card.photo-fullwidth{
  grid-column:1 / -1;
  padding:24px 28px;
}
.detail-card.photo-fullwidth .photo-grid{
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:8px;
}
.detail-card.photo-fullwidth .photo-grid .photo-item{
  border-width:3px;
  aspect-ratio:1/1;
}
.detail-card.photo-fullwidth .photo-grid .photo-item img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.detail-card.photo-fullwidth .photo-grid .photo-item:hover{
  transform:rotate(0deg) scale(1.04);
  box-shadow:0 6px 24px rgba(215,25,56,.4);
  z-index:4;
  border-color:var(--red);
}

.detail-footer{
  width:min(1200px,100%);
  margin:36px auto 0;
  padding-top:14px;
  border-top:2px solid rgba(243,241,235,.36);
}
.detail-footer .pager{display:none!important}

.portal-stage{
  --hole-x:50vw;
  --hole-y:50vh;
  position:fixed;
  inset:0;
  z-index:9200;
  pointer-events:none;
  overflow:hidden;
}
.portal-dim{
  position:absolute;
  inset:0;
  z-index:0;
  background:rgba(7,7,7,0);
  backdrop-filter:blur(0px);
  transition:background .55s ease,backdrop-filter .55s ease;
}
.portal-stage.centered .portal-dim{background:rgba(7,7,7,.87);backdrop-filter:blur(5px)}
.portal-stage .transition-card{
  z-index:2;
  transition:left .58s var(--ease),top .58s var(--ease),width .58s var(--ease),height .58s var(--ease),transform .58s var(--ease),filter .58s ease;
}
.portal-stage.centered .transition-card{
  left:50%!important;
  top:50%!important;
  width:min(620px,72vw)!important;
  height:150px!important;
  transform:translate(-50%,-50%) rotate(0deg)!important;
  filter:contrast(1.05);
}
.portal-stage.maximize .transition-card{width:92vw!important;height:54vh!important}
.portal-stage.maximize .transition-card .menu-card-shadow{opacity:0;transition:opacity .3s ease}
.portal-stage.maximize .transition-card .menu-card{background:transparent;clip-path:none;transition:background .25s ease}
.portal-stage.maximize .transition-card .menu-card-inner{inset:0;justify-content:center;overflow:visible;background:transparent;clip-path:none}
.portal-stage.maximize .transition-card .menu-card-inner::before,
.portal-stage.maximize .transition-card .menu-card-inner::after,
.portal-stage.maximize .transition-card .menu-no,
.portal-stage.maximize .transition-card .menu-title small,
.portal-stage.maximize .transition-card .menu-arrow{opacity:0;transition:opacity .18s ease}
.portal-stage .transition-card .menu-title strong{transition:font-size .68s var(--ease),letter-spacing .68s var(--ease),text-shadow .3s ease}
.portal-stage.maximize .transition-card .menu-title{width:100%;text-align:center}
.portal-stage.maximize .transition-card .menu-title strong{
  color:var(--white);
  white-space:nowrap;
  font-size:clamp(92px,15vw,230px);
  line-height:.72;
  letter-spacing:-.105em;
  text-shadow:10px 10px 0 var(--red);
}
.portal-aperture{
  position:fixed;
  z-index:3;
  left:var(--hole-x);
  top:var(--hole-y);
  width:20px;
  height:20px;
  border-radius:50%;
  background:var(--black);
  box-shadow:0 0 0 4px var(--white),7px 7px 0 4px var(--red);
  opacity:0;
  transform:translate(-50%,-50%) scale(.1);
  transition:opacity .18s ease,transform .32s var(--ease);
}
.portal-stage.aperture .portal-aperture{opacity:1;transform:translate(-50%,-50%) scale(1)}
.portal-preview{
  position:fixed;
  inset:0;
  z-index:4;
  overflow:hidden;
  clip-path:circle(0px at var(--hole-x) var(--hole-y));
  transition:clip-path .82s cubic-bezier(.12,.72,.12,1);
  background:var(--black);
}
.portal-preview .detail-title-page{
  position:absolute;
  left:0;
  right:0;
  top:var(--nav);
  bottom:0;
  min-height:0;
  height:auto
}
.portal-preview .back-btn,
.portal-preview .detail-scroll-cue{visibility:hidden}
.portal-stage.reveal .portal-preview{clip-path:circle(150vmax at var(--hole-x) var(--hole-y))}
.portal-stage.reveal .transition-card,
.portal-stage.reveal .portal-aperture{opacity:0;transition:opacity .18s ease}

.portal-stage.reverse .portal-preview{
  z-index:4;
  clip-path:circle(150vmax at var(--hole-x) var(--hole-y));
  transition:clip-path .82s cubic-bezier(.12,.72,.12,1),opacity .24s ease;
}
.portal-stage.reverse .transition-card{z-index:6}
.portal-stage.reverse .portal-aperture{z-index:5;opacity:1;transform:translate(-50%,-50%) scale(1)}
.portal-stage.reverse .portal-dim{z-index:1;background:rgba(7,7,7,.18);backdrop-filter:blur(1px)}
.portal-stage.reverse.close-preview .portal-preview{clip-path:circle(0px at var(--hole-x) var(--hole-y))}
.portal-stage.reverse.close-preview .portal-aperture{opacity:0;transform:translate(-50%,-50%) scale(.08);transition:opacity .28s ease,transform .58s var(--ease)}
.portal-stage.reverse.close-preview .portal-dim{background:rgba(7,7,7,0);backdrop-filter:blur(0)}
.portal-stage.reverse.return-card .transition-card{filter:contrast(1.04)}

@media(max-width:760px){

  }
}

/* =========================================================
   IMAGE GRID STYLES (头像、证书、摄影)
   ========================================================= */

.avatar-grid{
  display:grid;
  grid-template-columns:120px 1fr;
  gap:18px;
  margin-top:4px;
  align-items:center;
}
.avatar-grid .avatar-img{
  width:100%;
  aspect-ratio:1/1;
  border-radius:50%;
  border:3px solid var(--white);
  box-shadow:0 0 0 5px var(--red),0 6px 24px rgba(0,0,0,.7);
  overflow:hidden;
  cursor:pointer;
  transition:transform .3s var(--ease),box-shadow .3s var(--ease);
  background:var(--black2);
}
.avatar-grid .avatar-img img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.avatar-grid .avatar-img:hover{
  transform:scale(1.04) rotate(2deg);
  box-shadow:0 0 0 5px var(--white),0 6px 30px rgba(215,25,56,.5);
}
.avatar-grid .avatar-info{
  display:flex;
  flex-direction:column;
  gap:2px;
}
.avatar-grid .avatar-info .avatar-name{
  font-size:clamp(26px,3.2vw,42px);
  font-weight:1000;
  letter-spacing:-.04em;
  color:var(--white);
}
.avatar-grid .avatar-info .avatar-name small{
  color:var(--red);
  font-size:.45em;
  font-weight:400;
  letter-spacing:.08em;
}
.avatar-grid .avatar-info .avatar-tag{
  color:var(--grey);
  font-size:9px;
  font-weight:900;
  letter-spacing:.08em;
}
.avatar-grid .avatar-info .avatar-tag span{color:var(--white)}
.avatar-grid .avatar-info .avatar-desc{
  color:#a9abad;
  font-size:10px;
  line-height:1.5;
  margin-top:2px;
}
.avatar-grid .avatar-info .avatar-contact{
  display:flex;
  flex-wrap:wrap;
  gap:3px 14px;
  margin-top:2px;
  color:#8d8d8d;
  font-size:8px;
  font-weight:900;
  letter-spacing:.08em;
}
.avatar-grid .avatar-info .avatar-contact span{color:var(--white)}

.cert-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:8px;
}
.cert-item{
  border:2px solid var(--white);
  overflow:hidden;
  background:var(--black2);
  transition:transform .25s var(--ease),box-shadow .25s var(--ease);
  transform:rotate(var(--tilt,0deg));
  cursor:pointer;
}
.cert-item:nth-child(odd){--tilt:-1deg}
.cert-item:nth-child(even){--tilt:1.5deg}
.cert-item:hover{
  transform:rotate(0deg) scale(1.02);
  box-shadow:0 6px 20px rgba(215,25,56,.3);
  z-index:5;
}
.cert-item img{
  width:100%;
  height:auto;
  display:block;
}
.cert-label{
  display:block;
  padding:5px 8px;
  background:var(--red);
  color:var(--white);
  font:900 7px/1.3 Arial,sans-serif;
  letter-spacing:.1em;
  text-align:center;
}

.photo-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:8px;
}
.photo-grid .photo-item{
  border:2px solid var(--white);
  overflow:hidden;
  aspect-ratio:1/1;
  background:var(--black2);
  transition:transform .25s var(--ease),box-shadow .25s var(--ease);
  transform:rotate(var(--tilt,0deg));
  cursor:pointer;
}
.photo-grid .photo-item:nth-child(3n+1){--tilt:-1.2deg}
.photo-grid .photo-item:nth-child(3n+2){--tilt:1.5deg}
.photo-grid .photo-item:nth-child(3n+3){--tilt:-0.4deg}
.photo-grid .photo-item:hover{
  transform:rotate(0deg) scale(1.04);
  box-shadow:0 4px 18px rgba(215,25,56,.35);
  z-index:4;
  border-color:var(--red);
}
.photo-grid .photo-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* =========================================================
   LIGHTBOX
   ========================================================= */
.lightbox{
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(7,7,7,.92);
  backdrop-filter:blur(12px);
  opacity:0;
  pointer-events:none;
  transition:opacity .32s ease,backdrop-filter .32s ease;
  padding:30px;
}
.lightbox.open{
  opacity:1;
  pointer-events:auto;
}
.lightbox .lightbox-close{
  position:absolute;
  top:24px;
  right:28px;
  width:48px;
  height:48px;
  border:2px solid var(--white);
  background:var(--black);
  color:var(--white);
  font-size:18px;
  font-weight:1000;
  display:grid;
  place-items:center;
  transform:rotate(3deg);
  transition:background .2s ease,transform .2s ease;
  z-index:10;
}
.lightbox .lightbox-close:hover{
  background:var(--white);
  color:var(--black);
  transform:rotate(-3deg) scale(1.06);
}
.lightbox .lightbox-image-wrap{
  max-width:92vw;
  max-height:82vh;
  overflow:hidden;
  border:4px solid var(--white);
  box-shadow:0 0 0 8px var(--red),0 20px 60px rgba(0,0,0,.8);
  transform:scale(.92) rotate(-.5deg);
  transition:transform .35s var(--ease),box-shadow .35s var(--ease);
  background:var(--black);
}
.lightbox.open .lightbox-image-wrap{
  transform:scale(1) rotate(0deg);
  box-shadow:0 0 0 8px var(--red),0 30px 80px rgba(0,0,0,.9);
}
.lightbox .lightbox-image-wrap img{
  display:block;
  max-width:100%;
  max-height:82vh;
  width:auto;
  height:auto;
  object-fit:contain;
}
.lightbox .lightbox-caption{
  position:absolute;
  bottom:30px;
  left:50%;
  transform:translateX(-50%) translateY(12px);
  background:rgba(7,7,7,.8);
  border:2px solid var(--white);
  padding:6px 16px;
  color:var(--white);
  font-size:9px;
  font-weight:900;
  letter-spacing:.1em;
  opacity:0;
  transition:opacity .28s ease,transform .28s ease;
  text-align:center;
  backdrop-filter:blur(4px);
  white-space:nowrap;
}
.lightbox.open .lightbox-caption{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
.lightbox .lightbox-nav{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:48px;
  height:48px;
  border:2px solid var(--white);
  background:rgba(7,7,7,.7);
  color:var(--white);
  font-size:18px;
  font-weight:1000;
  display:grid;
  place-items:center;
  transition:background .2s ease,transform .2s ease;
  backdrop-filter:blur(4px);
  z-index:10;
}
.lightbox .lightbox-nav:hover{
  background:var(--white);
  color:var(--black);
  transform:translateY(-50%) scale(1.08);
}
.lightbox .lightbox-nav.prev{left:20px}
.lightbox .lightbox-nav.next{right:20px}

@media(max-width:760px){
  .lightbox{padding:12px}
  .lightbox .lightbox-image-wrap{
    border-width:3px;
    box-shadow:0 0 0 4px var(--red),0 12px 40px rgba(0,0,0,.8);
  }
  .lightbox .lightbox-close{
    top:14px;
    right:14px;
    width:40px;
    height:40px;
    font-size:14px;
  }
  .lightbox .lightbox-nav{
    width:38px;
    height:38px;
    font-size:14px;
  }
  .lightbox .lightbox-nav.prev{left:8px}
  .lightbox .lightbox-nav.next{right:8px}
  .lightbox .lightbox-caption{
    bottom:16px;
    font-size:7px;
    padding:4px 10px;

  }

function injectMenuFragments(){
  $$(".menu-item").forEach((item,index)=>{
    if(!$(".menu-splinter",item)){
      const classes=[
        "menu-splinter a",
        "menu-splinter red b",
        "menu-splinter white c",
        "menu-splinter red d",
        "menu-splinter red e",
        "menu-splinter white f"
      ];

      classes.forEach((className,i)=>{
        const part=document.createElement("i");
        part.className=className;
        item.insertBefore(part,item.firstChild);
      });
    }
  });

  const layer=$(".menu-layer");

  [
    ["s8",""],
    ["s9","white"],
    ["s10","black"],
    ["s11","white"],
    ["s12",""]
  ].forEach(([slot,tone])=>{
    if($(`.${slot}`,layer))return;

    const shard=document.createElement("i");
    shard.className=`shard ${tone} ${slot}`.trim();

    layer.appendChild(shard);
  });
}

injectMenuFragments();


function calculateMenuBurst(){
  const scene=$("#homeScene");
  const logo=$("#logoCore");

  const sceneRect=scene.getBoundingClientRect();
  const logoRect=logo.getBoundingClientRect();

  const originX=
    logoRect.left+
    logoRect.width*.66-
    sceneRect.left;

  const originY=
    logoRect.top+
    logoRect.height*.43-
    sceneRect.top;

  $$(".menu-item").forEach(item=>{
    const finalX=item.offsetLeft;
    const finalY=item.offsetTop;

    const dx=finalX-originX;
    const dy=finalY-originY;

    item.style.setProperty(
      "--from-x",
      `${originX-finalX}px`
    );

    item.style.setProperty(
      "--from-y",
      `${originY-finalY}px`
    );

    item.style.setProperty(
      "--over-x",
      `${dx*.12}px`
    );

    item.style.setProperty(
      "--over-y",
      `${dy*.12}px`
    );

    item.style.setProperty(
      "--settle-x",
      `${-dx*.035}px`
    );

    item.style.setProperty(
      "--settle-y",
      `${-dy*.035}px`
    );
  });
}


function openMenu(){
  if(menuBusy||menuOpened)return;

  menuBusy=true;

  const scene=$("#homeScene");
  const core=$("#logoCore");

  calculateMenuBurst();

  scene.classList.remove("menu-closing","menu-open");
  scene.classList.add("menu-opening");

  core.classList.add("menu-mode");

  $("#logoButton").setAttribute("aria-expanded","true");
  $("#logoButton").setAttribute("aria-label","收回个人档案菜单");

  setTimeout(()=>{
    scene.classList.remove("menu-opening");
    scene.classList.add("menu-open");

    menuOpened=true;
    menuBusy=false;
  },reducedMotion?20:1180);
}


function closeMenu(){
  if(menuBusy||!menuOpened)return;

  menuBusy=true;

  const scene=$("#homeScene");
  const core=$("#logoCore");

  calculateMenuBurst();

  scene.classList.remove("menu-open","menu-opening");
  scene.classList.add("menu-closing");

  $("#logoButton").setAttribute("aria-expanded","false");
  $("#logoButton").setAttribute("aria-label","展开个人档案菜单");

  setTimeout(()=>{
    scene.classList.remove("menu-closing");
    core.classList.remove("menu-mode");

    menuOpened=false;
    menuBusy=false;
  },reducedMotion?20:650);
}


$("#logoButton").setAttribute("aria-expanded","false");

$("#logoButton").addEventListener("click",()=>{
  menuOpened ? closeMenu() : openMenu();
});

function cloneMenuCard(source){
  const rect=source.getBoundingClientRect();
  const clone=document.createElement("div");

  clone.className="transition-card";
  clone.innerHTML=`
    <span class="menu-card-shadow"></span>
    <span class="menu-card">
      <span class="menu-card-inner">
        ${$(".menu-card-inner",source).innerHTML}
      </span>
    </span>
  `;

  clone.style.left=rect.left+"px";
  clone.style.top=rect.top+"px";
  clone.style.width=rect.width+"px";
  clone.style.height=rect.height+"px";
  clone.style.transform=getComputedStyle(source).transform==="none" ? "none" : getComputedStyle(source).transform;

  return clone;
}

function stripIds(root){
  if(root.id)root.removeAttribute("id");
  root.querySelectorAll("[id]").forEach(node=>node.removeAttribute("id"));
  return root;
}

function createPortalPreview(){
  const preview=document.createElement("div");
  preview.className="portal-preview";
  const titlePage=stripIds($("#detailTitlePage").cloneNode(true));
  preview.appendChild(titlePage);
  return preview;
}

function openSection(item){
  if(locked)return;
  locked=true;

  const section=item.dataset.section;
  renderDetail(section);

  if(reducedMotion){
    $("#homeScene").classList.remove("active");
    $("#detailScene").classList.add("active");
    $("#detailScene").scrollTop=0;
    locked=false;
    return;
  }

  const stage=document.createElement("div");
  stage.className="portal-stage";

  const dim=document.createElement("div");
  dim.className="portal-dim";

  const clone=cloneMenuCard(item);
  const aperture=document.createElement("i");
  aperture.className="portal-aperture";
  const preview=createPortalPreview();

  stage.append(dim,clone,aperture,preview);
  document.body.appendChild(stage);
  item.style.visibility="hidden";

  requestAnimationFrame(()=>stage.classList.add("centered"));

  setTimeout(()=>{
    stage.classList.add("maximize");
  },560);

  setTimeout(()=>{
    const title=$(".menu-title strong",clone);
    const rect=title.getBoundingClientRect();
    const holeFactor=sections[section].hole ?? .57;
    const holeX=Math.max(24,Math.min(window.innerWidth-24,rect.left+rect.width*holeFactor));
    const holeY=Math.max(24,Math.min(window.innerHeight-24,rect.top+rect.height*.5));

    stage.style.setProperty("--hole-x",holeX+"px");
    stage.style.setProperty("--hole-y",holeY+"px");
    stage.classList.add("aperture");
  },1130);

  setTimeout(()=>{
    $("#homeScene").classList.remove("active");
    $("#detailScene").classList.add("active");
    $("#detailScene").scrollTop=0;
    stage.classList.add("reveal");
  },1280);

  setTimeout(()=>{
    stage.remove();
    item.style.visibility="";
    locked=false;
  },2160);
}

$$(".menu-item").forEach(item=>{
  item.addEventListener("click",()=>openSection(item));
});


/* =========================================================
   TITLE -> MENU REVERSE PORTAL (点击标题返回)
   ========================================================= */

function closeDetailViaTitle(){
  if(locked || !currentSection)return;

  locked=true;

  const section=currentSection;
  const item=$(`.menu-item[data-section="${section}"]`);

  if(reducedMotion || !item){
    $("#detailScene").classList.remove("active");
    $("#homeScene").classList.add("active");
    $("#detailScene").scrollTop=0;
    currentSection=null;
    locked=false;
    return;
  }

  const titleRect=$("#detailTitle").getBoundingClientRect();
  const holeX=Math.max(24,Math.min(window.innerWidth-24,titleRect.left+titleRect.width*.5));
  const holeY=Math.max(24,Math.min(window.innerHeight-24,titleRect.top+titleRect.height*.46));

  const stage=document.createElement("div");
  stage.className="portal-stage reverse centered maximize";
  stage.style.setProperty("--hole-x",holeX+"px");
  stage.style.setProperty("--hole-y",holeY+"px");

  const dim=document.createElement("div");
  dim.className="portal-dim";

  const clone=cloneMenuCard(item);
  const aperture=document.createElement("i");
  aperture.className="portal-aperture";
  const preview=createPortalPreview();

  stage.append(dim,preview,aperture,clone);
  document.body.appendChild(stage);

  item.style.visibility="hidden";

  $("#homeScene").classList.add("active");
  $("#detailScene").classList.remove("active");

  void stage.offsetWidth;

  requestAnimationFrame(()=>{
    stage.classList.add("close-preview");
    stage.classList.remove("maximize");
  });

  setTimeout(()=>{
    stage.classList.add("return-card");
    stage.classList.remove("centered");
  },610);

  setTimeout(()=>{
    stage.remove();
    item.style.visibility="";
    $("#detailScene").scrollTop=0;
    currentSection=null;
    locked=false;
  },1280);
}

/* =========================================================
   LIGHTBOX
   ========================================================= */

let lightboxOpen=false;
let lightboxImages=[];
let lightboxIndex=0;

function bindLightboxTriggers(){
  const triggers=$$("[data-lightbox]");
  triggers.forEach(el=>{
    el.removeEventListener("click",lightboxClickHandler);
    el.addEventListener("click",lightboxClickHandler);
  });
}

function lightboxClickHandler(e){
  const el=e.currentTarget;
  const src=el.dataset.lightbox;
  const caption=el.dataset.caption||"";
  const parent=el.closest(".detail-grid")||document;
  const all=$$("[data-lightbox]",parent);
  const srcs=all.map(x=>x.dataset.lightbox);
  const caps=all.map(x=>x.dataset.caption||"");
  const idx=srcs.indexOf(src);
  if(idx!==-1){
    lightboxImages=srcs.map((s,i)=>({src:s, caption:caps[i]||""}));
    lightboxIndex=idx;
    openLightbox();
  }else{
    openLightboxSingle(src,caption);
  }
}

function openLightboxSingle(src,caption){
  lightboxImages=[{src, caption:caption||""}];
  lightboxIndex=0;
  openLightbox();
}

function openLightbox(){
  const lb=$("#lightbox");
  const img=$("#lightboxImg");
  const cap=$("#lightboxCaption");
  const prev=$("#lightboxPrev");
  const next=$("#lightboxNext");

  if(!lightboxImages.length)return;

  const data=lightboxImages[lightboxIndex];
  img.src=data.src;
  img.alt=data.caption||"放大预览";
  cap.textContent=data.caption||"";

  prev.style.display=lightboxImages.length>1 ? "flex" : "none";
  next.style.display=lightboxImages.length>1 ? "flex" : "none";

  lb.classList.add("open");
  lightboxOpen=true;
  document.body.style.overflow="hidden";
}

function closeLightbox(){
  const lb=$("#lightbox");
  lb.classList.remove("open");
  lightboxOpen=false;
  document.body.style.overflow="";
}

function navigateLightbox(dir){
  if(!lightboxImages.length)return;
  lightboxIndex=(lightboxIndex+dir+lightboxImages.length)%lightboxImages.length;
  const data=lightboxImages[lightboxIndex];
  const img=$("#lightboxImg");
  const cap=$("#lightboxCaption");
  img.src=data.src;
  img.alt=data.caption||"放大预览";
  cap.textContent=data.caption||"";
}

$("#lightboxClose").addEventListener("click",closeLightbox);
$("#lightboxPrev").addEventListener("click",()=>navigateLightbox(-1));
$("#lightboxNext").addEventListener("click",()=>navigateLightbox(1));

$("#lightbox").addEventListener("click",(e)=>{
  if(e.target===e.currentTarget){
    closeLightbox();
  }
});

document.addEventListener("keydown",(e)=>{
  if(!lightboxOpen)return;
  if(e.key==="ArrowLeft"){
    e.preventDefault();
    navigateLightbox(-1);
  }else if(e.key==="ArrowRight"){
    e.preventDefault();
    navigateLightbox(1);
  }else if(e.key==="Escape"){
    closeLightbox();
  }
});

    </div>
  `).join("")}


  <h2>能力矩阵</h2>

  <div class="grid">
    ${resume.skills.map(group=>`
      <div class="item">

        <h3>${esc(group.group)}</h3>

        <p>
          ${group.items
            .map(x=>`${esc(x[0])}：${esc(x[2])}`)
            .join("　")}
        </p>

      </div>
    `).join("")}
  </div>


  <h2>教育与荣誉</h2>

  ${resume.education.map(x=>`
    <div class="item">

      <h3>
        ${esc(x.title)}
        ·
        ${esc(x.degree)}
      </h3>

      <div class="meta">
        ${esc(x.date)}
      </div>

      <ul>
        ${x.bullets
          .map(v=>`<li>${esc(v)}</li>`)
          .join("")}
      </ul>

    </div>
  `).join("")}

  <p>
    ${resume.honors
      .map(x=>`${esc(x[0])}：${esc(x[1])}`)
      .join("　|　")}
  </p>
`;
</script>

</body>
</html>
