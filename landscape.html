<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>尉跃海 — 横屏作品集</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#002fa7;overscroll-behavior:none}#stage{position:fixed;left:0;top:0;border:0;transform-origin:0 0;background:#002fa7}#loading{position:fixed;inset:0;display:grid;place-items:center;color:white;font:14px Arial;pointer-events:none}#loading[hidden]{display:none}</style></head>
<body><div id="loading" role="status">正在打开作品集…</div><iframe id="stage" title="尉跃海横屏作品集" allow="fullscreen" allowfullscreen></iframe>
<script>
(function(){
const frame=document.getElementById('stage'),loading=document.getElementById('loading');
let pending=0,last='';
function fit(){
pending=0;
const v=window.visualViewport,w=Math.round(v?v.width:innerWidth),h=Math.round(v?v.height:innerHeight);
if(!w||!h)return;
const portrait=h>w,key=w+':'+h;
if(last===key)return;last=key;
frame.style.width=(portrait?h:w)+'px';frame.style.height=(portrait?w:h)+'px';
frame.style.transform=portrait?'translateX('+w+'px) rotate(90deg)':'none';
frame.dataset.mode=portrait?'rotated-landscape':'native-landscape';
}
function schedule(){if(!pending)pending=requestAnimationFrame(fit)}
fit();
addEventListener('resize',schedule,{passive:true});
addEventListener('orientationchange',()=>{schedule();setTimeout(schedule,180);setTimeout(schedule,500)},{passive:true});
if(visualViewport)visualViewport.addEventListener('resize',schedule,{passive:true});
frame.addEventListener('load',()=>{loading.hidden=true});
frame.src='./portfolio.html'+location.search+location.hash;
})();
</script></body></html>
